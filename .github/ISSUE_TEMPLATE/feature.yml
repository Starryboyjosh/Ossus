name: Feature proposal
description: Propose behavior that fits the approved roadmap.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or maintainer problem, not only a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Primary domain
      options: [Registry, Resolver, Researcher, CLI, Adapter, Evaluation, Security, Documentation]
    validations:
      required: true
  - type: textarea
    id: trust
    attributes:
      label: Trust and compatibility impact
      description: Identify new inputs, permissions, hosts, sources, or mutations.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I checked the WAVE roadmap and this is not already assigned.
          required: true
        - label: I understand substantial architecture changes require an ADR.
          required: true
