schema_version = "1.0.0"
security_waves = ["WAVE-000", "WAVE-007", "WAVE-010", "WAVE-017", "WAVE-018", "WAVE-020", "WAVE-021", "WAVE-023"]

[roles]

[roles.architecture_owner]
responsibility = "Maintains product coherence and proposes WAVE boundaries for Closure Agent decision."
configured_model = "configurable"

[roles.implementation_agent]
responsibility = "Implements non-security WAVEs and produces test evidence."
configured_model = "configurable"

[roles.security_implementer]
responsibility = "Implements security WAVE work under a bounded assignment; cannot independently review or close its own work."
configured_model = "configurable"
required = false
grants_closure_authority = false

[roles.implementation_support]
responsibility = "Performs attributed, bounded implementation and test work under the Implementer Agent's scope."
configured_model = "configurable"
required = false
grants_security_authority = false

[roles.independent_review_agent]
responsibility = "Independently reviews the final change and evidence; must not implement or close the same change."
configured_model = "configurable"
required = true
grants_closure_authority = false

[roles.security_review_agent]
responsibility = "Independently reviews security-sensitive work, trust boundaries, and attack evidence; must not implement or close the same change."
configured_model = "configurable"
required = true
grants_closure_authority = false

[roles.closure_agent]
responsibility = "Verifies evidence and independent review, then records the final accepted, rejected, or blocked decision."
configured_model = "configurable"
required = true
must_be_separate_from_implementer = true
must_be_separate_from_reviewer = true

[roles.optional_human_evidence]
responsibility = "May supply additional evidence or operational authorization; does not replace the Closure Agent's technical decision."
configured_model = "not-applicable"
required = false
