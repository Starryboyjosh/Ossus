[[fixtures]]
file = "invalid/budget-long-string.toml"
expectation = "invalid"
defect = "description must be amplified past the 32 KiB parser string budget"
rule = "parser-budget"
notes = "Amplification seed: repeat the description value in memory until it exceeds 32 KiB, then parse. The checked-in value is about 180 characters and remains below the schema's 512-character description limit; the amplified case targets the parser budget before schema validation."
reason_code = "budget.string-length.exceeded"

[[fixtures]]
file = "invalid/budget-deep-nesting.toml"
expectation = "invalid"
defect = "nested inline table exceeds parser depth 32"
rule = "parser-budget"
notes = "The `budget_probe` key is deliberately outside the canonical schema so it can carry arbitrary nesting. The parser must reject depth about 40 before schema validation; otherwise F-11 would also reject the key."
reason_code = "budget.nesting-depth.exceeded"

[[fixtures]]
file = "invalid/budget-many-items.toml"
expectation = "invalid"
defect = "list seed must be amplified past the 2,000-item parser budget"
rule = "parser-budget"
notes = "Amplification seed: expand `budget_probe` in memory from 50 unique items to 2,001 before parsing. The unknown key permits an arbitrary seed list; the parser-budget check must run before schema validation, which would otherwise reject the key under F-11."
reason_code = "budget.list-items.exceeded"

