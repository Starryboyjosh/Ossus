schema_version = "1.0.0"
capability_schema = "1.0.0"
id = "mohitagw.technical-spec-template"
name = "Technical Specification Template"
description = "Creates decision-oriented technical specifications with API contracts, alternatives, security considerations, testing, rollout, and rollback planning."
resource_type = "prompt-pack"
categories = ["backend"]
triggers = [
  "design an API contract",
  "write a technical specification",
  "create an engineering spec",
  "document API requests and errors",
]
exclusions = [
  "trivial bug fix",
  "implementation-only task without a design decision",
  "database schema-only design",
  "executing API calls or commands",
  "mutating project files",
]

[source]
mode = "remote-index"
repository = "https://github.com/mohitagw15856/pm-claude-skills.git"
