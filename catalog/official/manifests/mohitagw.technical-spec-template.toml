license = "MIT"

[capabilities]
required = ["architecture.api-design"]

[compatibility]
surfaces = ["agent-skills-standard"]
portability = "portable-standard"
scopes = ["project"]

[runtime]
requirements = ["instruction-only"]
external_tools = []

[risk]
tier = "R0"
notes = "Static Markdown instructions, references, and templates; illustrative API examples do not authorize execution or file mutation."

[review]
status = "approved"
tier = "light-human"
approved_commit = "fddfbc4a6caa8b4d3d41a69c666efaaff9d42def"
