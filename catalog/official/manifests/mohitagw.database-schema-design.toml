schema_version = "1.0.0"
capability_schema = "1.0.0"
id = "mohitagw.database-schema-design"
name = "Database Schema Design"
description = "Produces a database schema design document with entity relationships, DDL, constraints, indexes, access patterns, normalization decisions, and migration notes."
resource_type = "prompt-pack"
categories = ["database"]
triggers = [
  "design a database schema",
  "model entities and relationships",
  "define table constraints and indexes",
  "prepare a data model for review",
]
exclusions = [
  "database migration execution",
  "query-performance investigation without schema changes",
  "API contract design without data-model work",
  "executing SQL or database commands",
  "mutating project files",
]

